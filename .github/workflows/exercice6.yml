
name: Exercice 6

on:
  workflow_dispatch:

jobs:
  tester_node:
    runs-on: ubuntu-${{ matrix.version_ubuntu }}

    strategy:
      matrix:
        version_ubuntu: [22, 24]
        version_node: [18, 20, 22]

    steps:
      - name: Installer Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version: ${{ matrix.version_node }}

      - name: Afficher les versions
        run: |
          echo "Version Ubuntu : ${{ matrix.version_ubuntu }}"
          echo "Version Node.js : $(node --version)"
